<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grain Shape Studio</title>
<style>
  :root {
    color-scheme: light dark;
    --background: light-dark(#f1f1ee, #0f1013);
    --foreground: light-dark(#17181c, #f4f5f7);
    --card: light-dark(#ffffff, #181a1f);
    --card-foreground: var(--foreground);
    --primary: light-dark(#17181c, #f4f5f7);
    --primary-foreground: light-dark(#ffffff, #17181c);
    --secondary: light-dark(#e7e7e3, #24272d);
    --secondary-foreground: var(--foreground);
    --muted: light-dark(#e3e4e6, #25282e);
    --muted-foreground: light-dark(#646870, #aeb3bd);
    --accent: light-dark(#dfe9f7, #23374f);
    --accent-foreground: var(--foreground);
    --border: light-dark(#d2d4d8, #343840);
    --input: var(--border);
    --ring: #5798e6;
    --radius: 12px;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--background);
    color: var(--foreground);
  }

  * { box-sizing: border-box; }

  html, body {
    min-width: 320px;
    min-height: 100%;
    margin: 0;
  }

  body {
    background: var(--background);
    color: var(--foreground);
  }

  main {
    width: min(1180px, 100%);
    margin-inline: auto;
    padding: clamp(14px, 2vw, 28px);
  }

  .card {
    min-width: 0;
    padding: 12px;
    overflow: hidden;
    color: var(--card-foreground);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .viz-badge {
    width: fit-content;
    padding: 4px 9px;
    border-radius: 999px;
    color: var(--accent-foreground);
    background: var(--accent);
    font-weight: 500;
  }

  .viz-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .btn,
  .form-control,
  .form-select {
    min-height: 38px;
    border: 1px solid var(--input);
    border-radius: 9px;
    color: var(--secondary-foreground);
    background: var(--secondary);
    font: inherit;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 8px 12px;
    cursor: pointer;
  }

  .btn:hover { background: var(--accent); }
  .btn:focus-visible,
  .form-control:focus-visible,
  .form-select:focus-visible,
  .form-range:focus-visible,
  .form-check-input:focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }

  .btn-primary {
    border-color: transparent;
    color: var(--primary-foreground);
    background: var(--primary);
  }

  .form-label {
    color: var(--foreground);
    font-weight: 500;
  }

  .form-select {
    width: 100%;
    padding: 7px 10px;
  }

  .form-range {
    width: 100%;
    accent-color: var(--primary);
  }

  .form-control-color {
    width: 100%;
    padding: 3px;
  }

  .form-check {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .form-check-input {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--primary);
  }

  .text-small { font-size: 0.875rem; }
  .text-muted { color: var(--muted-foreground); }

  output {
    color: var(--muted-foreground);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<main>
<div id="grain-shape-studio">
  <header class="grain-topbar">
    <div class="grain-brand">
      <span class="grain-lamp" aria-hidden="true"></span>
      <div>
        <strong>GRAIN SHAPE STUDIO</strong>
        <span>геометрия → зернистая поверхность</span>
      </div>
    </div>
    <nav class="grain-nav" aria-label="Переключение редакторов">
      <a class="grain-home-link" href="/">← На главную</a>
    </nav>
  </header>

  <div class="grain-layout">
    <aside class="grain-controls" aria-label="Настройки зернистого эффекта">
      <div class="grain-panel-label">Настройки</div>

      <section class="grain-section">
        <div class="grain-section-title">Фигура</div>
<label class="form-label">Формат холста<select class="form-select" id="grain-ratio">
<option value="1:1">1:1 — квадрат</option><option value="3:4">3:4</option><option value="4:3">4:3</option><option value="9:16">9:16</option><option value="16:9">16:9</option><option value="2:3">2:3</option><option value="3:2">3:2</option><option value="custom">Свой формат</option></select></label>
<div id="grain-custom-ratio" hidden><label class="form-label">Ширина<input class="form-input" id="grain-ratio-w" type="number" min="1" max="10000" value="3"></label><label class="form-label">Высота<input class="form-input" id="grain-ratio-h" type="number" min="1" max="10000" value="4"></label></div>
        <label class="form-label" for="grain-shape">
          Фигура
          <select class="form-select" id="grain-shape">
            <option value="circle">Круг</option>
            <option value="square">Квадрат</option>
            <option value="rounded" selected>Скруглённый квадрат</option>
            <option value="triangle">Треугольник</option>
            <option value="diamond">Ромб</option>
            <option value="hexagon">Шестиугольник</option>
            <option value="star">Звезда</option>
            <option value="capsule">Капсула</option>
            <option value="cube">Куб 3D</option>
            <option value="sphere3d">Сфера 3D</option>
          </select>
        </label>

        <label class="form-label" for="grain-size-shape">
          Размер фигуры <output id="grain-size-shape-value">68%</output>
          <input class="form-range" id="grain-size-shape" type="range" min="30" max="86" value="68">
        </label>

        <label class="form-label" for="grain-rotation">
          <span id="grain-rotation-label">Поворот</span> <output id="grain-rotation-value">0°</output>
          <input class="form-range" id="grain-rotation" type="range" min="-180" max="180" value="0">
        </label>

        <div class="grain-cube-controls" id="grain-three-controls" hidden>
          <label class="form-label" for="grain-three-yaw">
            Вращение по горизонтали <output id="grain-cube-yaw-value">-32°</output>
            <input class="form-range" id="grain-three-yaw" type="range" min="-180" max="180" value="-32">
          </label>

          <label class="form-label" for="grain-three-pitch">
            Наклон <output id="grain-cube-pitch-value">24°</output>
            <input class="form-range" id="grain-three-pitch" type="range" min="-85" max="85" value="24">
          </label>

          <label class="form-label" for="grain-three-transparency">
            Прозрачность поверхности <output id="grain-cube-transparency-value">78%</output>
            <input class="form-range" id="grain-three-transparency" type="range" min="0" max="100" value="78">
          </label>
        </div>
      </section>

      <section class="grain-section">
        <div class="grain-section-title">Эффект</div>
        <label class="form-label" for="grain-density">
          Плотность <output id="grain-density-value">62%</output>
          <input class="form-range" id="grain-density" type="range" min="5" max="100" value="62">
        </label>

        <label class="form-label" for="grain-particle">
          Размер зерна <output id="grain-particle-value">1.4 px</output>
          <input class="form-range" id="grain-particle" type="range" min="4" max="40" value="14">
        </label>

        <label class="form-label" for="grain-softness">
          Мягкость края <output id="grain-softness-value">26 px</output>
          <input class="form-range" id="grain-softness" type="range" min="0" max="80" value="26">
        </label>

        <label class="form-label" for="grain-edge">
          Акцент на краях <output id="grain-edge-value">18%</output>
          <input class="form-range" id="grain-edge" type="range" min="0" max="100" value="18">
        </label>

        <label class="form-label" for="grain-strength">
          Контраст зерна <output id="grain-strength-value">78%</output>
          <input class="form-range" id="grain-strength" type="range" min="10" max="100" value="78">
        </label>
      </section>

      <section class="grain-section">
        <div class="grain-section-title">Цвет и фон</div>
        <div class="grain-colors">
          <label class="form-label" for="grain-color">
            Зерно
            <input class="form-control form-control-color" id="grain-color" type="color" value="#f4f4f4">
          </label>
          <label class="form-label" for="grain-background">
            Фон
            <input class="form-control form-control-color" id="grain-background" type="color" value="#050505">
          </label>
        </div>

        <div class="form-check form-switch">
          <input class="form-check-input" id="grain-transparent" type="checkbox">
          <label class="form-check-label" for="grain-transparent">Прозрачный фон</label>
        </div>
      </section>
    </aside>

    <section class="grain-preview grain-workspace" aria-label="Предпросмотр эффекта">
      <div class="grain-content-head">
        <span class="grain-content-label">Предпросмотр</span>
        <span class="grain-effect-name" id="grain-effect-name">ЗЕРНИСТОЕ РАСПЫЛЕНИЕ</span>
      </div>
      <div class="card grain-artboard">
        <div class="grain-canvas-stack">
          <canvas id="grain-canvas" width="720" height="720" role="img" aria-label="Геометрическая фигура с зернистым эффектом"></canvas>
          <canvas id="grain-three-canvas" width="720" height="720" role="img" aria-label="Вращаемая трёхмерная фигура из частиц" hidden></canvas>
        </div>
      </div>
      <div class="grain-workspace-footer">
        <div class="grain-caption text-small" id="grain-caption" aria-live="polite">Перетаскивайте фигуру по холсту</div>
        <div class="viz-row grain-actions">
          <button class="btn" id="grain-randomize" type="button">Новая текстура</button>
          <button class="btn btn-primary" id="grain-export" type="button">Скачать PNG</button>
        </div>
      </div>
    </section>
  </div>
</div>

<style>
  #grain-shape-studio {
    width: 100%;
    min-width: 0;
    color: var(--foreground);
  }

  #grain-shape-studio * {
    box-sizing: border-box;
  }

  #grain-shape-studio [hidden] {
    display: none !important;
  }

  #grain-shape-studio .grain-layout {
    display: grid;
    grid-template-columns: minmax(230px, 280px) minmax(0, 1fr);
    gap: 18px;
    align-items: start;
  }

  #grain-shape-studio .grain-controls {
    display: grid;
    gap: 13px;
    min-width: 0;
  }

  #grain-shape-studio .grain-cube-controls {
    display: grid;
    gap: 13px;
  }

  #grain-shape-studio .grain-controls .form-label {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 5px 10px;
    align-items: baseline;
    margin: 0;
  }

  #grain-shape-studio .grain-controls :is(.form-range, .form-select) {
    grid-column: 1 / -1;
  }

  #grain-shape-studio .grain-colors {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  #grain-shape-studio .grain-colors .form-control-color {
    grid-column: 1 / -1;
  }

  #grain-shape-studio .grain-preview {
    display: grid;
    gap: 8px;
    min-width: 0;
  }

  #grain-shape-studio canvas {
    display: block;
    width: 100%;
    max-width: 720px;
    height: auto;
    aspect-ratio: 1;
    margin-inline: auto;
    touch-action: none;
    cursor: grab;
  }

  #grain-shape-studio canvas.is-dragging {
    cursor: grabbing;
  }

  #grain-shape-studio .grain-caption {
    min-height: 1.3em;
    text-align: center;
  }

  @media (max-width: 700px) {
    #grain-shape-studio .grain-layout {
      grid-template-columns: 1fr;
    }

    #grain-shape-studio .grain-controls {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    #grain-shape-studio .grain-controls > :is(.viz-badge, .viz-row, .form-check, .grain-cube-controls),
    #grain-shape-studio .grain-colors {
      grid-column: 1 / -1;
    }
  }

  @media (max-width: 460px) {
    #grain-shape-studio .grain-controls {
      grid-template-columns: 1fr;
    }

    #grain-shape-studio .grain-controls > *,
    #grain-shape-studio .grain-colors {
      grid-column: 1;
    }
  }
</style>

<style id="grain-retro-blue">

  :root {
    color-scheme: dark;
    --background: #074b98;
    --foreground: #f4fbff;
    --card: #063a78;
    --card-foreground: #f4fbff;
    --primary: #d6d9df;
    --primary-foreground: #202630;
    --secondary: #0b5aa8;
    --secondary-foreground: #f4fbff;
    --muted: #084788;
    --muted-foreground: #badcf5;
    --accent: #9ad9ff;
    --accent-foreground: #052e5e;
    --border: #7fc3f2;
    --input: #0b5aa8;
    --ring: #d6d9df;
    --retro-font-mono: 'VT323', 'Courier New', monospace;
    --retro-font-display: 'Press Start 2P', 'Courier New', monospace;
    --retro-shadow: 4px 4px 0 rgba(0, 0, 0, 0.24);
    --retro-grid-size: 30px;
    --retro-grid-line: rgba(255, 255, 255, 0.18);
  }

  html,
  body {
    width: 100%;
    min-height: 100%;
    background: var(--background);
  }

  body {
    color: var(--foreground);
    font-family: var(--retro-font-mono);
  }

  main {
    width: 100%;
    min-height: 100dvh;
    margin: 0;
    padding: 0;
  }

  #grain-shape-studio {
    width: 100%;
    min-height: 100dvh;
    padding: clamp(14px, 1.4vw, 26px);
    color: var(--foreground);
    background-color: var(--background);
    background-image:
      linear-gradient(to right, var(--retro-grid-line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--retro-grid-line) 1px, transparent 1px);
    background-size: var(--retro-grid-size) var(--retro-grid-size);
  }

  #grain-shape-studio .grain-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  #grain-shape-studio .grain-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  #grain-shape-studio .grain-brand > div {
    min-width: 0;
  }

  #grain-shape-studio .grain-brand strong {
    display: block;
    font-family: var(--retro-font-display);
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--foreground);
    text-shadow: 2px 2px 0 color-mix(in srgb, var(--border) 58%, transparent);
  }

  #grain-shape-studio .grain-brand span:not(.grain-lamp) {
    display: block;
    margin-top: 5px;
    color: var(--muted-foreground);
    letter-spacing: 1px;
  }

  #grain-shape-studio .grain-lamp {
    width: 12px;
    height: 12px;
    flex: 0 0 auto;
    background: var(--primary);
    box-shadow: 0 0 12px var(--primary), 0 0 24px var(--primary);
    transform: rotate(45deg);
  }

  #grain-shape-studio .grain-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  #grain-shape-studio .grain-current-tool {
    display: inline-flex;
    align-items: center;
    min-height: 38px;
    padding: 8px 14px;
    border: 2px solid var(--primary);
    color: var(--primary-foreground);
    background: var(--primary);
    box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.24);
    font-size: 14px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  #grain-shape-studio .grain-layout {
    width: 100%;
    min-height: calc(100dvh - 96px);
    display: grid;
    grid-template-columns: minmax(290px, 360px) minmax(0, 1fr);
    gap: clamp(18px, 2vw, 34px);
    align-items: stretch;
  }

  #grain-shape-studio .grain-controls {
    display: flex;
    flex-direction: column;
    gap: 0;
    min-width: 0;
    padding: 16px;
    border: 3px double var(--border);
    background: var(--card);
    box-shadow: inset 0 0 0 1px var(--background), var(--retro-shadow);
  }

  #grain-shape-studio .grain-panel-label {
    margin-bottom: 16px;
    color: var(--primary);
    font-family: var(--retro-font-display);
    font-size: 11px;
    letter-spacing: 1px;
  }

  #grain-shape-studio .grain-section {
    display: grid;
    gap: 10px;
    margin: 0 0 14px;
    padding: 0 0 14px;
    border-bottom: 2px dashed var(--border);
  }

  #grain-shape-studio .grain-section:last-child {
    margin-bottom: 0;
    padding-bottom: 0;
    border-bottom: 0;
  }

  #grain-shape-studio .grain-section-title {
    color: var(--muted-foreground);
    font-family: var(--retro-font-display);
    font-size: 10px;
    letter-spacing: 1px;
  }

  #grain-shape-studio .grain-controls .form-label {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 5px 10px;
    align-items: baseline;
    margin: 0;
    color: var(--foreground);
    font-family: var(--retro-font-mono);
    font-size: 17px;
    font-weight: 400;
  }

  #grain-shape-studio .grain-controls :is(.form-range, .form-select) {
    grid-column: 1 / -1;
  }

  #grain-shape-studio output {
    color: var(--muted-foreground);
  }

  #grain-shape-studio .form-select,
  #grain-shape-studio .form-control {
    min-height: 38px;
    padding: 6px 10px;
    border: 2px solid var(--input);
    border-radius: 0;
    color: var(--foreground);
    background: var(--background);
    box-shadow: inset 2px 2px 0 rgba(0, 0, 0, 0.12);
    font-family: var(--retro-font-mono);
    font-size: 17px;
  }

  #grain-shape-studio .form-control-color {
    width: 100%;
    padding: 3px;
  }

  #grain-shape-studio .form-range {
    width: 100%;
    height: 6px;
    accent-color: var(--primary);
  }

  #grain-shape-studio .form-check {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--foreground);
    font-size: 17px;
  }

  #grain-shape-studio .form-check-input {
    width: 17px;
    height: 17px;
    border-radius: 0;
    accent-color: var(--primary);
  }

  #grain-shape-studio .grain-cube-controls {
    display: grid;
    gap: 10px;
  }

  #grain-shape-studio .grain-colors {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  #grain-shape-studio .btn {
    min-height: 38px;
    padding: 8px 14px;
    border: 2px solid var(--border);
    border-radius: 0;
    color: var(--foreground);
    background: var(--secondary);
    box-shadow: var(--retro-shadow);
    font-family: var(--retro-font-mono);
    font-size: 14px;
    letter-spacing: 0.5px;
    text-decoration: none;
    text-transform: uppercase;
    transition: transform 0.1s ease, background 0.1s ease, box-shadow 0.1s ease;
  }

  #grain-shape-studio .btn:hover {
    color: var(--foreground);
    background: var(--muted);
    transform: translate(-1px, -1px);
    box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.22);
  }

  #grain-shape-studio .btn:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.22);
  }

  #grain-shape-studio .btn-primary {
    border-color: var(--primary);
    color: var(--primary-foreground);
    background: var(--primary);
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.24);
  }

  #grain-shape-studio .btn-primary:hover {
    color: var(--primary-foreground);
    background: color-mix(in srgb, var(--primary) 82%, black);
  }

  #grain-shape-studio :is(.btn, .form-control, .form-select, .form-range, .form-check-input):focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }

  #grain-shape-studio .grain-workspace {
    width: 100%;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  #grain-shape-studio .grain-content-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
    color: var(--muted-foreground);
    font-family: var(--retro-font-display);
    font-size: 10px;
    letter-spacing: 1px;
  }

  #grain-shape-studio .grain-effect-name {
    color: var(--primary);
  }

  #grain-shape-studio .grain-artboard {
    width: min(100%, calc(100dvh - 188px), 900px);
    max-width: none;
    margin-inline: auto;
    padding: 8px;
    border: 4px solid var(--border);
    border-radius: 0;
    color: var(--card-foreground);
    background: #050505;
    box-shadow: inset 0 0 0 2px var(--background), 0 0 0 2px var(--border), var(--retro-shadow);
  }

  #grain-shape-studio .grain-canvas-stack {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    overflow: hidden;
    background: #050505;
  }

  #grain-shape-studio canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    max-width: none;
    height: 100%;
    margin: 0;
    touch-action: none;
    cursor: grab;
  }

  #grain-shape-studio canvas.is-dragging {
    cursor: grabbing;
  }

  #grain-shape-studio .grain-workspace-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 14px;
  }

  #grain-shape-studio .grain-caption {
    min-height: 1.3em;
    color: var(--muted-foreground);
    font-size: 17px;
    text-align: left;
  }

  #grain-shape-studio .grain-actions {
    margin-left: auto;
  }

  @media (min-width: 1600px) {
    #grain-shape-studio .grain-layout {
      grid-template-columns: minmax(320px, 390px) minmax(0, 1fr);
    }
  }

  @media (max-width: 820px) {
    #grain-shape-studio {
      padding: 12px;
    }

    #grain-shape-studio .grain-layout {
      min-height: 0;
      grid-template-columns: 1fr;
    }

    #grain-shape-studio .grain-controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    #grain-shape-studio .grain-panel-label {
      grid-column: 1 / -1;
      margin-bottom: 0;
    }

    #grain-shape-studio .grain-section {
      margin: 0;
      padding: 0 14px 0 0;
      border-right: 2px dashed var(--border);
      border-bottom: 0;
    }

    #grain-shape-studio .grain-section:nth-of-type(even),
    #grain-shape-studio .grain-section:last-child {
      padding-right: 0;
      border-right: 0;
    }

    #grain-shape-studio .grain-artboard {
      width: min(100%, 720px);
    }
  }

  @media (max-width: 560px) {
    #grain-shape-studio .grain-topbar {
      align-items: flex-start;
    }

    #grain-shape-studio .grain-nav,
    #grain-shape-studio .grain-nav > * {
      width: 100%;
    }

    #grain-shape-studio .grain-nav > * {
      justify-content: center;
    }

    #grain-shape-studio .grain-controls {
      display: flex;
    }

    #grain-shape-studio .grain-section {
      margin: 0 0 14px;
      padding: 0 0 14px;
      border-right: 0;
      border-bottom: 2px dashed var(--border);
    }

    #grain-shape-studio .grain-content-head,
    #grain-shape-studio .grain-workspace-footer {
      align-items: flex-start;
      flex-direction: column;
    }

    #grain-shape-studio .grain-actions,
    #grain-shape-studio .grain-actions .btn {
      width: 100%;
      margin-left: 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #grain-shape-studio .btn {
      transition: none;
    }
  }

<style id="grain-blueprint-skin">
/* Dark, legible drafting desk. No editor controls or render algorithms removed. */
:root {
  color-scheme: dark;
  --background: #0b2746;
  --foreground: #ecf6ff;
  --card: #0e3053;
  --card-foreground: #ecf6ff;
  --primary: #c9ebff;
  --primary-foreground: #102d4b;
  --secondary: #204c72;
  --secondary-foreground: #f2f8ff;
  --muted: #1b4063;
  --muted-foreground: #b7d6eb;
  --accent: #326387;
  --accent-foreground: #fff;
  --border: #547b9c;
  --input: #7094b3;
  --ring: #b9e9ff;
  --retro-font-mono: "Courier New", Courier, monospace;
  --retro-font-display: "Courier New", Courier, monospace;
  --retro-shadow: none;
}
html, body { min-width: 320px; background: #071c33; }
body {

  background-color: #082442;
  background-image: linear-gradient(#8bc1ec10 1px,transparent 1px),linear-gradient(90deg,#8bc1ec10 1px,transparent 1px);
  background-size: 32px 32px;
  font: 14px/1.4 Arial, Tahoma, sans-serif;
}
main {

  min-height: 100dvh;
  padding: 0;
}
#grain-shape-studio {

  min-height: 100dvh;
  padding: clamp(12px, 1.6vw, 25px);
  border: none;
  color: #ecf6ff;
  background-color: #0b2c50;
  background-image: linear-gradient(#82b8dc10 1px,transparent 1px),linear-gradient(90deg,#82b8dc10 1px,transparent 1px);
  background-size: 28px 28px;
  font: 14px/1.4 Arial, Tahoma, sans-serif;
}
#grain-shape-studio .grain-topbar {

#grain-shape-studio .grain-lamp { display: none; }
#grain-shape-studio .grain-brand strong {

  text-shadow: none;
}
#grain-shape-studio .grain-brand span:not(.grain-lamp) {

}
#grain-shape-studio .grain-home-link {

  text-decoration: underline;
  text-underline-offset: 2px;
}
#grain-shape-studio .grain-home-link:visited { color: #cfdeff; }
#grain-shape-studio .grain-layout {
  min-height: 0;

  gap: clamp(12px, 1.6vw, 23px);
  align-items: start;
}
#grain-shape-studio .grain-controls {
  min-width: 0;
  padding: 14px;
  border: 1px solid #527c9f;
  background: #0e3155;
  box-shadow: none;
}
#grain-shape-studio .grain-panel-label {
  margin-bottom: 12px;
  color: #eaf7ff;
  font: bold 18px Arial, Tahoma, sans-serif;
  letter-spacing: 0;
}
#grain-shape-studio .grain-section {
  gap: 9px;
  margin-bottom: 13px;
  padding-bottom: 13px;
  border-bottom: 1px solid #456989;
}
#grain-shape-studio .grain-section-title {
  color: #b7ddf6;
  font: bold 13px Arial, Tahoma, sans-serif;
  letter-spacing: 0;
}
#grain-shape-studio .grain-controls .form-label {
  gap: 3px 8px;
  color: #ebf7ff;
  font: 14px Arial, Tahoma, sans-serif;
}
#grain-shape-studio output { color: #c8e7ff; }
#grain-shape-studio .form-select,
#grain-shape-studio .form-control,
#grain-shape-studio .form-input {

  padding: 5px 8px;
  border: 1px solid #719cbd;

  box-shadow: none;

}
#grain-shape-studio .form-range {
  width: 100%;
  height: 6px;
  margin: 5px 0;

}
#grain-shape-studio .form-check {
  color: #ebf7ff;
  font: 14px Arial, Tahoma, sans-serif;
}
#grain-shape-studio .form-check-input { accent-color: #94daff; }
#grain-shape-studio .grain-content-head {
  margin-bottom: 10px;

  font: 12px "Courier New", Courier, monospace;
  letter-spacing: 0;
}
#grain-shape-studio .grain-effect-name { color: #c4e7ff; text-align: right; }
#grain-shape-studio .grain-workspace { width: 100%; min-width: 0; }
#grain-shape-studio .grain-artboard {
  /* Exact width is recomputed from the canvas ratio and viewport by fitPreviewToViewport(). */
  box-sizing: border-box;
  max-width: 100%;
  width: 100%;
  margin-inline: auto;
  padding: 6px;
  border: 1px solid #87b4d4;
  border-radius: 0;
  background: #04090e;
  box-shadow: 0 0 0 5px #153d63;
}
#grain-shape-studio .grain-canvas-stack {
  width: 100%;
  height: auto;
  background: #04090e;
}
#grain-shape-studio .grain-workspace-footer {
  margin-top: 14px;
  align-items: center;
}
#grain-shape-studio .grain-caption {
  color: #b7d8ee;
  font: 13px Arial, Tahoma, sans-serif;
  text-align: left;
}
#grain-shape-studio .btn {
  min-height: 35px;
  padding: 7px 12px;
  border: 1px solid #7096b7;
  border-radius: 2px;
  color: #edf8ff;
  background: #1f5279;
  box-shadow: none;
  font: 13px Arial, Tahoma, sans-serif;
  letter-spacing: 0;
  text-decoration: none;
  text-transform: none;
  transition: none;
}
#grain-shape-studio .btn:hover {
  color: #fff;
  background: #326689;
  transform: none;
  box-shadow: none;
}
#grain-shape-studio .btn:active { background: #113c60; transform: none; box-shadow: none; }
#grain-shape-studio .btn-primary {
  border-color: #8bcbed;
  color: #092d4d;
  background: #b0e3ff;
  box-shadow: none;
  font-weight: 600;
}
#grain-shape-studio .btn-primary:hover { color: #092d4d; background: #daf1ff; }
@media (min-width: 1600px) {
  #grain-shape-studio .grain-layout { grid-template-columns: minmax(245px, 280px) minmax(0, 1fr); }
}
@media (max-width: 820px) {
  #grain-shape-studio .grain-layout { min-height: 0; grid-template-columns: 1fr; }
  #grain-shape-studio .grain-controls { display: flex; flex-direction: column; gap: 0; }
  #grain-shape-studio .grain-section {
    margin: 0 0 12px;
    padding: 0 0 12px;
    border: 0;
    border-bottom: 1px solid #456989;
  }
  #grain-shape-studio .grain-artboard { max-width: 100%; }
}
@media (max-width: 560px) {
  #grain-shape-studio .grain-topbar { gap: 8px; }
  #grain-shape-studio .grain-nav, #grain-shape-studio .grain-nav > * { width: auto; }
  #grain-shape-studio .grain-actions { width: 100%; }
}
</style>
